<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plane Shooter - Anup Kumar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02082a}
body{font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#fs{position:fixed;right:10px;top:10px;z-index:5;border:2px solid #fff;border-radius:12px;background:#172044;color:#fff;padding:10px 14px;font-size:22px}
</style>
</head>
<body>
<button id="fs">⛶</button>
<canvas id="game"></canvas>

<script>
"use strict";

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var W = 0, H = 0;
var state = "menu";
var score = 0, level = 1, lives = 3, hp = 100;
var bullets = [], enemies = [], enemyShots = [], particles = [];
var boss = null;
var spawnTimer = 0, shotTimer = 0;
var keys = {left:false,right:false,shoot:false};
var touches = {};
var audioCtx = null;

var player = {x:0,y:0,speed:7};

var stars = [];
for (var i=0;i<140;i++) {
  stars.push({x:Math.random(), y:Math.random(), s:1+Math.random()*2.5, v:0.5+Math.random()*2});
}

function resize(){
  W = Math.max(320, window.innerWidth);
  H = Math.max(400, window.innerHeight);
  canvas.width = W;
  canvas.height = H;
  if (state === "menu" || state === "gameover" || state === "win") {
    player.x = W/2;
    player.y = H-150;
  }
}
window.addEventListener("resize", resize);
resize();

function sound(freq, time){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.frequency.value = freq;
    g.gain.value = 0.04;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + time);
  }catch(e){}
}

function bg(){
  ctx.fillStyle = "#061450";
  ctx.fillRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    s.y += s.v/H;
    if(s.y>1){s.y=0;s.x=Math.random();}
    ctx.fillStyle="#fff";
    ctx.fillRect(s.x*W,s.y*H,s.s,s.s);
  }
}

function txt(t,x,y,size,color){
  ctx.fillStyle=color || "#fff";
  ctx.font="bold "+size+"px Arial";
  ctx.textAlign="center";
  ctx.fillText(t,x,y);
}

function rectButton(x,y,w,h,label){
  ctx.fillStyle="#263865";
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  ctx.strokeRect(x,y,w,h);
  txt(label,x+w/2,y+h/2+7,19,"#fff");
}

function start(){
  state="game";
  score=0; level=1; lives=3; hp=100;
  bullets=[]; enemies=[]; enemyShots=[]; particles=[]; boss=null;
  spawnTimer=0; shotTimer=0;
  player.x=W/2; player.y=H-150;
  keys.left=false; keys.right=false; keys.shoot=false;
  touches={};
  sound(520,0.12);
}

function shoot(){
  bullets.push({x:player.x,y:player.y-38,vx:0});
  if(level>=4){
    bullets.push({x:player.x-14,y:player.y-30,vx:-1.5});
    bullets.push({x:player.x+14,y:player.y-30,vx:1.5});
  }
  sound(760,0.035);
}

function enemy(){
  var r=Math.random(), type=r<0.18?"fast":(r<0.32?"tank":"normal");
  var size=type==="tank"?52:(type==="fast"?30:38);
  var maxhp=type==="tank"?2+Math.floor(level/3):1;
  enemies.push({
    x:size+Math.random()*(W-size*2),
    y:-60,size:size,hp:maxhp,maxhp:maxhp,
    speed:(type==="fast"?5:3.2)+level*0.45,
    type:type,dead:false
  });
}

function bossStart(){
  boss={
    x:W/2,y:120,w:Math.min(330,W*0.65),h:85,
    hp:180+level*45,maxhp:180+level*45,
    dir:1,t:0
  };
  sound(120,0.4);
}

function boom(x,y){
  for(var i=0;i<16;i++){
    particles.push({
      x:x,y:y,vx:(Math.random()-0.5)*8,
      vy:(Math.random()-0.5)*8,life:25+Math.random()*20
    });
  }
}

function hitPlayer(d){
  hp-=d;
  if(hp<=0){
    hp=100; lives--;
    boom(player.x,player.y);
    if(lives<=0) state="gameover";
  }
}

function dist(a,b,c,d){
  var x=a-c,y=b-d;
  return Math.sqrt(x*x+y*y);
}

function update(){
  if(state!=="game") return;

  var speed=level>=8?10:player.speed;
  if(keys.left) player.x-=speed;
  if(keys.right) player.x+=speed;
  if(player.x<28) player.x=28;
  if(player.x>W-28) player.x=W-28;

  if(shotTimer>0) shotTimer--;
  if(keys.shoot && shotTimer<=0){
    shoot();
    shotTimer=level>=6?5:8;
  }

  for(var i=0;i<bullets.length;i++){
    bullets[i].x+=bullets[i].vx;
    bullets[i].y-=14;
  }
  bullets=bullets.filter(function(b){return b.y>-30 && b.x>-50 && b.x<W+50;});

  spawnTimer++;
  var delay=Math.max(14,52-level*3);
  if(!boss && spawnTimer>=delay){
    enemy(); spawnTimer=0;
  }

  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    e.y+=e.speed;
    if(dist(e.x,e.y,player.x,player.y)<e.size/2+24){
      e.dead=true; hitPlayer(30); boom(e.x,e.y);
    }
    for(var j=0;j<bullets.length;j++){
      var b=bullets[j];
      if(!e.dead && dist(e.x,e.y,b.x,b.y)<e.size/2+9){
        e.hp--; b.y=-100;
        if(e.hp<=0){
          e.dead=true;
          score += e.type==="tank"?30:(e.type==="fast"?20:10);
          boom(e.x,e.y);
        }
        break;
      }
    }
  }

  enemies=enemies.filter(function(e){
    if(e.dead) return false;
    if(e.y>H+60){ lives--; if(lives<=0) state="gameover"; return false; }
    return true;
  });

  if((level===5 || level===10) && !boss) bossStart();

  if(boss){
    boss.x += 3.5*boss.dir;
    if(boss.x<boss.w/2) boss.dir=1;
    if(boss.x>W-boss.w/2) boss.dir=-1;
    boss.t++;
    if(boss.t>Math.max(22,60-level*2)){
      enemyShots.push({x:boss.x,y:boss.y+45,vx:0,s:5+level*0.25});
      if(level>=7){
        enemyShots.push({x:boss.x,y:boss.y+45,vx:-2,s:5+level*0.25});
        enemyShots.push({x:boss.x,y:boss.y+45,vx:2,s:5+level*0.25});
      }
      boss.t=0;
    }

    for(i=0;i<bullets.length;i++){
      b=bullets[i];
      if(Math.abs(b.x-boss.x)<boss.w/2 && Math.abs(b.y-boss.y)<boss.h/2){
        boss.hp-=5; b.y=-100; boom(b.x,b.y);
        if(boss.hp<=0){
          score+=1000; boom(boss.x,boss.y); boss=null;
          if(level===10){state="win";sound(1000,0.5);}
          else {level++;sound(650,0.2);}
        }
        break;
      }
    }
  }

  for(i=0;i<enemyShots.length;i++){
    var es=enemyShots[i];
    es.x+=es.vx; es.y+=es.s;
    if(dist(es.x,es.y,player.x,player.y)<28){
      es.y=H+100; hitPlayer(20);
    }
  }
  enemyShots=enemyShots.filter(function(es){return es.y<H+80;});

  if(!boss && level!==5 && level!==10 && score>=level*150){
    level++;
    sound(650,0.18);
  }

  for(i=0;i<particles.length;i++){
    particles[i].x+=particles[i].vx;
    particles[i].y+=particles[i].vy;
    particles[i].life--;
  }
  particles=particles.filter(function(p){return p.life>0;});
}

function drawPlayer(){
  ctx.fillStyle="#22ddff";
  ctx.beginPath();
  ctx.moveTo(player.x,player.y-38);
  ctx.lineTo(player.x-32,player.y+34);
  ctx.lineTo(player.x,player.y+14);
  ctx.lineTo(player.x+32,player.y+34);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath(); ctx.arc(player.x,player.y-9,6,0,Math.PI*2); ctx.fill();
}

function drawEnemy(e){
  ctx.fillStyle=e.type==="tank"?"#a03cff":(e.type==="fast"?"#ff9a22":"#ff3d3d");
  ctx.beginPath();
  ctx.moveTo(e.x,e.y+e.size);
  ctx.lineTo(e.x-e.size/2,e.y-e.size/2);
  ctx.lineTo(e.x,e.y-8);
  ctx.lineTo(e.x+e.size/2,e.y-e.size/2);
  ctx.closePath(); ctx.fill();

  if(e.maxhp>1){
    ctx.fillStyle="#3b1111";
    ctx.fillRect(e.x-e.size/2,e.y-e.size/2-9,e.size,5);
    ctx.fillStyle="#36e36b";
    ctx.fillRect(e.x-e.size/2,e.y-e.size/2-9,e.size*(e.hp/e.maxhp),5);
  }
}

function drawBoss(){
  if(!boss) return;
  ctx.fillStyle="#a43cff";
  ctx.fillRect(boss.x-boss.w/2,boss.y-boss.h/2,boss.w,boss.h);
  ctx.fillStyle="#ff3030";
  ctx.beginPath();
  ctx.moveTo(boss.x,boss.y+62);
  ctx.lineTo(boss.x-boss.w/2,boss.y-42);
  ctx.lineTo(boss.x,boss.y-4);
  ctx.lineTo(boss.x+boss.w/2,boss.y-42);
  ctx.closePath(); ctx.fill();

  var bw=W*0.6;
  ctx.fillStyle="#431010";
  ctx.fillRect(W/2-bw/2,62,bw,14);
  ctx.fillStyle="#32e36b";
  ctx.fillRect(W/2-bw/2,62,bw*Math.max(0,boss.hp/boss.maxhp),14);
}

function hud(){
  ctx.textAlign="left";
  ctx.font="bold 18px Arial";
  ctx.fillStyle="#fff";
  ctx.fillText("SCORE: "+score,12,25);
  ctx.fillText("LIVES: "+lives,12,50);
  ctx.fillStyle="#501010"; ctx.fillRect(12,62,140,10);
  ctx.fillStyle="#32e36b"; ctx.fillRect(12,62,140*(hp/100),10);
  txt("LEVEL "+level+" / 10",W/2,27,19,"#ffd21e");
}

function controls(){
  var y=H-88, gap=8, w=Math.min(145,(W-gap*4)/3), h=62;
  rectButton(gap,y,w,h,"LEFT");
  rectButton(W/2-w/2,y,w,h,"SHOOT");
  rectButton(W-w-gap,y,w,h,"RIGHT");
}

function menu(){
  bg();
  txt("PLANE SHOOTER",W/2,H*0.28,Math.min(46,W/10),"#22ddff");
  txt("ADVANCED EDITION",W/2,H*0.36,21,"#ffd21e");
  var w=Math.min(300,W*0.68);
  rectButton(W/2-w/2,H/2-35,w,70,"PLAY");
  txt("10 LEVELS  •  BOSS BATTLES",W/2,H*0.68,16,"#fff");
  txt("Created by Anup Kumar",W/2,H-28,17,"#fff");
}

function gameover(){
  bg();
  txt("GAME OVER",W/2,H*0.36,48,"#ff3d3d");
  txt("SCORE: "+score,W/2,H*0.45,25,"#fff");
  var w=Math.min(300,W*0.68);
  rectButton(W/2-w/2,H*0.55,w,68,"PLAY AGAIN");
}

function win(){
  bg();
  txt("CONGRATULATIONS!",W/2,H*0.33,Math.min(40,W/11),"#ffd21e");
  txt("ALL 10 LEVELS COMPLETE!",W/2,H*0.43,22,"#fff");
  txt("FINAL SCORE: "+score,W/2,H*0.51,24,"#22ddff");
  txt("Created by Anup Kumar",W/2,H*0.57,17,"#fff");
  var w=Math.min(300,W*0.68);
  rectButton(W/2-w/2,H*0.64,w,68,"PLAY AGAIN");
}

function gameDraw(){
  bg();
  drawPlayer();

  for(var i=0;i<bullets.length;i++){
    ctx.fillStyle="#ffd21e";
    ctx.fillRect(bullets[i].x-3,bullets[i].y,6,20);
  }
  for(i=0;i<enemies.length;i++) drawEnemy(enemies[i]);
  drawBoss();

  for(i=0;i<enemyShots.length;i++){
    ctx.fillStyle="#ff4040";
    ctx.beginPath();
    ctx.arc(enemyShots[i].x,enemyShots[i].y,7,0,Math.PI*2);
    ctx.fill();
  }

  for(i=0;i<particles.length;i++){
    ctx.fillStyle="#ff9d20";
    ctx.beginPath();
    ctx.arc(particles[i].x,particles[i].y,4,0,Math.PI*2);
    ctx.fill();
  }

  hud();
  controls();
}

function loop(){
  if(state==="menu") menu();
  else if(state==="game"){update();gameDraw();}
  else if(state==="gameover") gameover();
  else if(state==="win") win();
  requestAnimationFrame(loop);
}

function actionAt(x,y){
  var by=H-88, gap=8, w=Math.min(145,(W-gap*4)/3);
  if(y<by) return null;
  if(x>=gap && x<=gap+w) return "left";
  if(x>=W/2-w/2 && x<=W/2+w/2) return "shoot";
  if(x>=W-w-gap && x<=W-gap) return "right";
  return null;
}

canvas.addEventListener("pointerdown",function(e){
  e.preventDefault();
  var a=actionAt(e.clientX,e.clientY);

  if(state==="menu"){
    if(e.clientY>H/2-45 && e.clientY<H/2+45) start();
    return;
  }

  if(state==="gameover" || state==="win"){
    if(e.clientY>H*0.52 && e.clientY<H*0.78) start();
    return;
  }

  if(state==="game" && a){
    touches[e.pointerId]=a;
    updateTouchControls();
    try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  }
},{passive:false});

canvas.addEventListener("pointerup",function(e){
  e.preventDefault();
  delete touches[e.pointerId];
  updateTouchControls();
},{passive:false});

canvas.addEventListener("pointercancel",function(e){
  delete touches[e.pointerId];
  updateTouchControls();
});

function updateTouchControls(){
  keys.left=false; keys.right=false; keys.shoot=false;
  for(var id in touches){
    if(touches[id]==="left") keys.left=true;
    if(touches[id]==="right") keys.right=true;
    if(touches[id]==="shoot") keys.shoot=true;
  }
}

document.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft") keys.left=true;
  if(e.key==="ArrowRight") keys.right=true;
  if(e.key===" "){keys.shoot=true;e.preventDefault();}
});
document.addEventListener("keyup",function(e){
  if(e.key==="ArrowLeft") keys.left=false;
  if(e.key==="ArrowRight") keys.right=false;
  if(e.key===" ") keys.shoot=false;
});

document.getElementById("fs").addEventListener("click",function(){
  try{
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }catch(e){}
});

player.x=W/2;
player.y=H-150;
loop();

</script>
</body>
</html>
